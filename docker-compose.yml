services:
  db:
    image: postgres:16-alpine
    container_name: verzel_db
    environment:
      POSTGRES_USER: verzel
      POSTGRES_PASSWORD: verzel
      POSTGRES_DB: verzel_ingressos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verzel -d verzel_ingressos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
