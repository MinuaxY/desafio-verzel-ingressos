server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # A aplicacao usa rotas no cliente. Sem este fallback, abrir
    # /meus-ingressos direto ou recarregar a pagina devolveria 404 do nginx,
    # porque o arquivo nao existe no disco — quem resolve a rota e o React.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Os arquivos com hash no nome podem ser cacheados para sempre; o
    # index.html nunca, senao o navegador continuaria servindo a versao antiga
    # depois de um deploy.
    location ~* \.(js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;
}
