# Infraestrutura da API no Render, declarada em arquivo em vez de cliques no
# painel: quem for reproduzir o deploy ve exatamente o que foi configurado.
#
# O front nao esta aqui — vai para a Vercel, que serve estatico melhor.
services:
  - type: web
    name: verzel-ingressos-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      # Banco fora do Render, preenchido no painel. O Postgres gratuito daqui
      # expira 30 dias depois de criado e é apagado 14 dias depois disso — foi
      # o que derrubou o ambiente em outubro de 2026, com a API em ciclo de
      # reinício por não achar banco na partida. Ver decisão D43.
      - key: DATABASE_URL
        sync: false
      # Gerados pelo Render e nunca vistos por ninguem. Os valores do .env
      # local sao de desenvolvimento e nao servem em producao.
      - key: JWT_SECRET
        generateValue: true
      - key: TICKET_SECRET
        generateValue: true
      # Preencher no painel com a URL da Vercel, depois que o front subir.
      - key: CORS_ORIGINS
        sync: false
      # Sem token, o catalogo cai no provedor local e a aplicacao funciona.
      - key: TMDB_READ_TOKEN
        sync: false
      - key: CATALOG_PROVIDER
        value: tmdb
      # Cria as contas e sessoes de demonstracao na primeira subida.
      - key: SEED_ON_START
        value: "true"

# Sem bloco `databases:` de propósito. O banco é um Postgres gerenciado fora do
# Render, que não tem prazo de validade; a URL de conexão entra como segredo no
# painel. `docker compose up` continua subindo um Postgres local para
# desenvolvimento, sem depender de nada disso.
